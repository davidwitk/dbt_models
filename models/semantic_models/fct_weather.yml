models:
  - name: fct_weather
    semantic_model:
      enabled: true
    agg_time_dimension: measured_at
    columns:
      - name: weather_id
        entity:
          type: primary
          name: weather
      - name: measured_at
        granularity: day
        dimension:
          type: time
      - name: location_name
        dimension:
          type: categorical
      - name: location_country
        dimension:
          type: categorical
    metrics:
      - name: measure_count
        description: Count of total measures.
        type: simple
        label: Measure Count
        agg: count
        expr: "1"
      - name: average_temperature
        description: Average temperature of specified measures.
        type: simple
        label: Average Temperature
        agg: average
        expr: temperature
