sources:
  - name: s3
    config:
      freshness:
        error_after: {count: 24, period: hour}
      loaded_at_field: "timezone('UTC', run_started_at :: timestamp)"
    tables:
      - name: raw_dbt_invocations
        config:
          loaded_at_query: "select max(timezone('UTC', run_started_at :: timestamp)) from read_parquet('s3://data-lake-chodera/dbt_artifacts/invocations/*.parquet', union_by_name=True)"
          meta:
            external_location: "read_parquet('s3://data-lake-chodera/dbt_artifacts/invocations/*.parquet', union_by_name=True)"
      - name: raw_dbt_model_executions
        config:
          loaded_at_query: "select max(timezone('UTC', run_started_at :: timestamp)) from read_parquet('s3://data-lake-chodera/dbt_artifacts/model_executions/*.parquet', union_by_name=True)"
          meta:
            external_location: "read_parquet('s3://data-lake-chodera/dbt_artifacts/model_executions/*.parquet', union_by_name=True)"
