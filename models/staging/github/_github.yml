sources:
  - name: s3
    config:
      freshness:
        error_after: {count: 24, period: hour}
      loaded_at_field: _extracted_at
    tables:
      - name: raw_github_commits
        config:
          loaded_at_query: "select max(_extracted_at) from read_csv('s3://data-lake-chodera/github_data/commits.csv', header=True)"
          meta:
            external_location: "read_csv('s3://data-lake-chodera/github_data/commits.csv', header=True)"
        columns:
          - name: sha
            data_tests:
              - not_null
              - unique
      - name: raw_github_prs
        config:
          loaded_at_query: "select max(_extracted_at) from read_csv('s3://data-lake-chodera/github_data/prs.csv', header=True)"
          meta:
            external_location: "read_csv('s3://data-lake-chodera/github_data/prs.csv', header=True)"
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
      - name: raw_github_repos
        config:
          loaded_at_query: "select max(_extracted_at) from read_csv('s3://data-lake-chodera/github_data/repos.csv', header=True)"
          meta:
            external_location: "read_csv('s3://data-lake-chodera/github_data/repos.csv', header=True)"
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
