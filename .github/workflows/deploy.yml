name: Deployment Pipeline for main

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: ./
  DBT_ENGINE_NO_WARN_SEMANTIC_MANIFEST_VALIDATION: true
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: eu-central-1
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install the dependencies
        run: uv sync

      - name: Run dbt to generate metadata
        run: |
          uv run dbt deps
          uv run dbt parse --target prod
          uv run dbt docs generate --target prod --output-dir public
        
      - name: Upload manifest to S3
        run: |
          aws s3 cp target/manifest.json ${{ secrets.AWS_BUCKET_URL }}/dbt_models/ci/manifest.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-central-1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Netlify
        run: npx --yes netlify-cli@27.10.2 deploy --no-build --prod --dir=public --site="$NETLIFY_SITE_ID"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
